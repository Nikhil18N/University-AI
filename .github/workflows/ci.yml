name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: university_ai
          POSTGRES_PASSWORD: university_ai_dev
          POSTGRES_DB: university_ai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U university_ai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://university_ai:university_ai_dev@localhost:5433/university_ai
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_KEY: ci-admin-key-not-for-production
      GEMINI_API_KEY: ci-dummy-gemini-key
      AUTO_CREATE_SCHEMA: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check
        working-directory: backend
        run: python -m compileall -q app

      - name: Initialize database schema
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: pytest -q -k "not test_feedback_submission"

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Run frontend unit checks
        working-directory: frontend
        run: npm test
